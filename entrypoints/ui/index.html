<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AriaNg - Aria2 Browser Shim</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; }
    #loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 16px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #22c55e; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tip { font-size: 13px; color: #666; max-width: 400px; text-align: center; }
    .tip code { background: #333; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading AriaNg...</p>
    <p class="tip">AriaNg will connect to <code>localhost:6800</code> automatically via the Aria2 Browser Shim extension.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ariang@1.3.8/dist/ariang.min.js"></script>
  <script>
    if (typeof AriaNg !== 'undefined') {
      document.getElementById('loading').innerHTML = '';
      new AriaNg({
        rpcAlias: 'Aria2 Browser Shim',
        rpcHost: 'localhost',
        rpcPort: '6800',
        protocol: 'http',
        globalStatRefreshInterval: 2000,
        taskRefreshInterval: 2000,
      });
    } else {
      document.getElementById('loading').innerHTML = '<div style="text-align:center; padding:40px;"><h2 style="color:#ef4444; margin-bottom:16px;">Failed to Load AriaNg</h2><p class="tip">Could not load AriaNg from CDN. Check your internet connection and refresh the page.</p></div>';
    }
  </script>
</body>
</html>
